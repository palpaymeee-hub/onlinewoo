<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Online</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#0a0a14;--surface:#11111e;--card:#191928;--border:#252540;--accent:#e8b86d;--accent2:#7c6af5;--accent3:#5de8a0;--text:#e8e8f0;--muted:#6666aa;--radius:12px}
*{box-sizing:border-box}
body{margin:0;font-family:Arial, Helvetica, sans-serif;background:var(--bg);color:var(--text)}
.header{background:var(--surface);padding:12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
.header-title{color:var(--accent);font-weight:700}
.nav-bar{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--surface);border-top:1px solid var(--border)}
.nav-item{flex:1;padding:10px;text-align:center;color:var(--muted);cursor:pointer}
.nav-item.active{color:var(--accent)}
.page{display:none;padding:16px 12px 90px}
.page.active{display:block}
.games-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.game-card{background:var(--card);padding:12px;border-radius:10px;border:1px solid var(--border);cursor:pointer}
.detail-header{background:var(--card);padding:12px;border-radius:8px;border:1px solid var(--border)}
.search-input{width:100%;padding:8px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:80px;background:#222;padding:10px 12px;border-radius:8px;border:1px solid var(--border);display:none}
</style>
</head>
<body>
<div class="header"><div class="header-title">⚡ Online</div><div>v17.0</div></div>

<!-- Pages -->
<div id="page-games" class="page active">
  <div style="margin-bottom:8px"><input id="search" class="search-input" placeholder="Search games..." oninput="applyFilters()"></div>
  <div id="games-grid" class="games-grid"></div>
</div>

<div id="page-detail" class="page">
  <div class="detail-header">
    <div id="detail-name" style="font-weight:700;font-size:18px"></div>
    <div id="detail-pkg" style="color:var(--muted);font-size:12px"></div>
  </div>
  <div style="margin-top:12px">
    <div style="margin-bottom:8px"><strong>Event Template</strong></div>
    <div id="detail-template" style="background:var(--card);padding:10px;border-radius:8px;border:1px solid var(--border)"></div>
  </div>
  <div style="margin-top:12px"><button onclick="goBack()">← Back</button></div>
</div>

<div id="page-python" class="page">
  <div style="font-weight:700">🐍 Python (disabled in this demo)</div>
</div>

<nav class="nav-bar">
  <div class="nav-item active" data-page="games" onclick="switchPage(event)">Games</div>
  <div class="nav-item" data-page="python" onclick="switchPage(event)">Python</div>
  <div class="nav-item" data-page="settings" onclick="switchPage(event)">Settings</div>
</nav>

<div id="toast" class="toast"></div>

<script>
// Clean, minimal data to avoid parse errors
const GAMES_DATA = [
  {name:"Color Sort Woody Puzzle",package:"games.burny.color.sort.woody.puzzle",dev_key:"CkyYk6ThNSr9MPEvmCNZRN",level_events:[{display:"Level completed",template:"level_completed"}],cat:"puzzle"},
  {name:"Wooden Word Puzzle",package:"games.burny.wooden.word.puzzle",dev_key:"CkyYk6ThNSr9MPEvmCNZRN",level_events:[{display:"Level completed",template:"level_completed_{}"}],cat:"puzzle"},
  {name:"Coin Master",package:"com.moonactive.coinmaster",dev_key:"H3KjoCRVTiVgA5mWSAHtCe",level_events:[{display:"Village complete",template:"village_{}_complete"}],cat:"other"},
  {name:"Gardenscapes",package:"com.playrix.gardenscapes",dev_key:"ixMH7WQi4SqLAmPWuyAtkH",level_events:[{display:"Level achieved",template:"AchievedLevel{}"}],cat:"other"}
];

let activeFilter = 'all';

function renderGames(list){
  const grid = document.getElementById('games-grid');
  grid.innerHTML = list.map((g,i)=>`<div class="game-card" onclick="openGame(${i})"><div style="font-size:12px;color:var(--accent)">#${String(i+1).padStart(2,'0')}</div><div style="font-weight:700">${escapeHtml(g.name)}</div><div style="font-size:11px;color:var(--muted)">${escapeHtml(g.package)}</div></div>`).join('');
}

function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function applyFilters(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  let list = GAMES_DATA;
  if(q) list = list.filter(g => g.name.toLowerCase().includes(q) || g.package.toLowerCase().includes(q));
  renderGames(list);
}

function openGame(i){
  const g = GAMES_DATA[i];
  document.getElementById('detail-name').textContent = g.name;
  document.getElementById('detail-pkg').textContent = g.package;
  document.getElementById('detail-template').textContent = g.level_events && g.level_events[0] ? g.level_events[0].template : '';
  switchTo('detail');
}

function goBack(){ switchTo('games'); }

function switchPage(e){ const p=e.currentTarget.dataset.page; if(p==='settings'){ alert('Settings are available in the full app'); } switchTo(p==='games'?'games':(p==='python'?'python':'games')); }

function switchTo(page){ document.querySelectorAll('.page').forEach(el=>el.classList.remove('active')); document.getElementById('page-'+page).classList.add('active'); document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active', n.dataset.page===page)); }

renderGames(GAMES_DATA);

// Simple toast
function showToast(msg, ms=2000){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',ms)}

</script>
</body>
</html>
