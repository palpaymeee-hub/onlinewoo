<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#0a0a14" />
<title>Online</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#0a0a14;
  --surface:#11111ecc;
  --card:#191928;
  --card-hover:#20203a;
  --border:#252540;
  --accent:#e8b86d;
  --accent2:#7c6af5;
  --accent3:#5de8a0;
  --text:#e8e8f0;
  --muted:#8888bb;
  --radius:14px;
  --safe-top:env(safe-area-inset-top);
  --safe-bottom:env(safe-area-inset-bottom);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,Helvetica,sans-serif;
  background:radial-gradient(circle at top, #14142a 0%, var(--bg) 60%);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

/* Header */
.header{
  position:sticky;
  top:0;
  z-index:10;
  background:var(--surface);
  backdrop-filter:blur(10px);
  padding:calc(12px + var(--safe-top)) 16px 12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid var(--border);
}
.header-title{color:var(--accent);font-weight:700;font-size:17px;letter-spacing:.2px}
.header-version{color:var(--muted);font-size:12px;background:var(--card);padding:3px 8px;border-radius:20px;border:1px solid var(--border)}

/* Layout container so content doesn't stretch too wide on desktop */
.container{max-width:720px;margin:0 auto}

/* Bottom nav */
.nav-bar{
  position:fixed;left:0;right:0;bottom:0;
  display:flex;
  background:var(--surface);
  backdrop-filter:blur(10px);
  border-top:1px solid var(--border);
  padding-bottom:var(--safe-bottom);
  z-index:10;
}
.nav-item{
  flex:1;
  padding:10px 4px 8px;
  text-align:center;
  color:var(--muted);
  cursor:pointer;
  font-size:12px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2px;
  transition:color .15s ease;
  user-select:none;
}
.nav-item .nav-icon{font-size:18px;line-height:1}
.nav-item.active{color:var(--accent)}
.nav-item:active{opacity:.7}

/* Pages */
.page{display:none}
.page.active{display:block;animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.page-inner{padding:16px 16px calc(96px + var(--safe-bottom))}

/* Search */
.search-wrap{margin-bottom:14px}
.search-input{
  width:100%;
  padding:11px 14px;
  border-radius:10px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  font-size:14px;
  outline:none;
  transition:border-color .15s ease, box-shadow .15s ease;
}
.search-input::placeholder{color:var(--muted)}
.search-input:focus{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(124,106,245,.2)}

/* Games grid - responsive */
.games-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(150px, 1fr));
  gap:10px;
}
.game-card{
  background:var(--card);
  padding:14px;
  border-radius:var(--radius);
  border:1px solid var(--border);
  cursor:pointer;
  transition:transform .12s ease, background .12s ease, border-color .12s ease;
}
.game-card:hover{background:var(--card-hover);border-color:var(--accent2)}
.game-card:active{transform:scale(.97)}
.game-card .idx{font-size:11px;color:var(--accent);font-weight:700;margin-bottom:4px}
.game-card .name{font-weight:700;font-size:14px;line-height:1.3;margin-bottom:4px;word-break:break-word}
.game-card .pkg{font-size:11px;color:var(--muted);word-break:break-all}
.empty-state{color:var(--muted);text-align:center;padding:40px 16px;font-size:14px}

/* Detail page */
.detail-header{
  background:var(--card);
  padding:16px;
  border-radius:var(--radius);
  border:1px solid var(--border);
}
.detail-header .name{font-weight:700;font-size:19px;margin-bottom:4px}
.detail-header .pkg{color:var(--muted);font-size:12px}
.detail-section{margin-top:16px}
.detail-section .label{margin-bottom:8px;font-weight:700;font-size:13px;color:var(--accent3)}
.detail-box{background:var(--card);padding:12px 14px;border-radius:10px;border:1px solid var(--border);font-size:14px;word-break:break-word}

/* Buttons */
.btn{
  appearance:none;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  padding:10px 16px;
  border-radius:10px;
  font-size:14px;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:6px;
  transition:background .15s ease, border-color .15s ease;
}
.btn:hover{background:var(--card-hover);border-color:var(--accent2)}
.btn:active{transform:scale(.97)}

/* Toast */
.toast{
  position:fixed;
  left:50%;
  transform:translateX(-50%);
  bottom:calc(84px + var(--safe-bottom));
  background:var(--card);
  color:var(--text);
  padding:10px 16px;
  border-radius:10px;
  border:1px solid var(--border);
  box-shadow:0 6px 20px rgba(0,0,0,.35);
  display:none;
  font-size:13px;
  z-index:20;
}

/* Placeholder page (python) */
.placeholder{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:60px 20px;
  color:var(--muted);
}
.placeholder .icon{font-size:32px;margin-bottom:8px}
.placeholder .title{font-weight:700;color:var(--text);font-size:16px;margin-bottom:4px}
</style>
</head>
<body>
<div class="header">
  <div class="header-title">⚡ Online</div>
  <div class="header-version">v17.1</div>
</div>

<div class="container">
  <!-- Pages -->
  <div id="page-games" class="page active">
    <div class="page-inner">
      <div class="search-wrap">
        <input id="search" class="search-input" placeholder="Search games..." oninput="applyFilters()">
      </div>
      <div id="games-grid" class="games-grid"></div>
    </div>
  </div>

  <div id="page-detail" class="page">
    <div class="page-inner">
      <div class="detail-header">
        <div id="detail-name" class="name"></div>
        <div id="detail-pkg" class="pkg"></div>
      </div>
      <div class="detail-section">
        <div class="label">Event Template</div>
        <div id="detail-template" class="detail-box"></div>
      </div>
      <div style="margin-top:16px">
        <button class="btn" onclick="goBack()">← Back</button>
      </div>
    </div>
  </div>

  <div id="page-python" class="page">
    <div class="page-inner">
      <div class="placeholder">
        <div class="icon">🐍</div>
        <div class="title">Python</div>
        <div>Disabled in this demo</div>
      </div>
    </div>
  </div>
</div>

<nav class="nav-bar">
  <div class="nav-item active" data-page="games" onclick="switchPage(event)">
    <span class="nav-icon">🎮</span><span>Games</span>
  </div>
  <div class="nav-item" data-page="python" onclick="switchPage(event)">
    <span class="nav-icon">🐍</span><span>Python</span>
  </div>
  <div class="nav-item" data-page="settings" onclick="switchPage(event)">
    <span class="nav-icon">⚙️</span><span>Settings</span>
  </div>
</nav>

<div id="toast" class="toast"></div>

<script>
// Clean, minimal data to avoid parse errors
const GAMES_DATA = [
  {name:"Color Sort Woody Puzzle",package:"games.burny.color.sort.woody.puzzle",dev_key:"CkyYk6ThNSr9MPEvmCNZRN",level_events:[{display:"Level completed",template:"level_completed"}],cat:"puzzle"},
  {name:"Wooden Word Puzzle",package:"games.burny.wooden.word.puzzle",dev_key:"CkyYk6ThNSr9MPEvmCNZRN",level_events:[{display:"Level completed",template:"level_completed_{}"}],cat:"puzzle"},
  {name:"Coin Master",package:"com.moonactive.coinmaster",dev_key:"H3KjoCRVTiVgA5mWSAHtCe",level_events:[{display:"Village complete",template:"village_{}_complete"}],cat:"other"},
  {name:"Gardenscapes",package:"com.playrix.gardenscapes",dev_key:"ixMH7WQi4SqLAmPWuyAtkH",level_events:[{display:"Level achieved",template:"AchievedLevel{}"}],cat:"other"}
];

let activeFilter = 'all';

function renderGames(list){
  const grid = document.getElementById('games-grid');
  if(!list.length){
    grid.innerHTML = '<div class="empty-state">No games match your search.</div>';
    return;
  }
  grid.innerHTML = list.map((g,i)=>`<div class="game-card" onclick="openGame(${i})"><div class="idx">#${String(i+1).padStart(2,'0')}</div><div class="name">${escapeHtml(g.name)}</div><div class="pkg">${escapeHtml(g.package)}</div></div>`).join('');
}

function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function applyFilters(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  let list = GAMES_DATA;
  if(q) list = list.filter(g => g.name.toLowerCase().includes(q) || g.package.toLowerCase().includes(q));
  renderGames(list);
}

function openGame(i){
  const g = GAMES_DATA[i];
  document.getElementById('detail-name').textContent = g.name;
  document.getElementById('detail-pkg').textContent = g.package;
  document.getElementById('detail-template').textContent = g.level_events && g.level_events[0] ? g.level_events[0].template : '';
  switchTo('detail');
}

function goBack(){ switchTo('games'); }

function switchPage(e){
  const p = e.currentTarget.dataset.page;
  if(p==='settings'){ showToast('Settings are available in the full app'); return; }
  switchTo(p);
}

function switchTo(page){
  document.querySelectorAll('.page').forEach(el=>el.classList.remove('active'));
  document.getElementById('page-'+page).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active', n.dataset.page===page));
  window.scrollTo(0,0);
}

renderGames(GAMES_DATA);

// Simple toast
function showToast(msg, ms=2200){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.style.display='block';
  clearTimeout(t._t);
  t._t=setTimeout(()=>t.style.display='none',ms);
}
</script>
</body>
</html>
